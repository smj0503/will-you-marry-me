<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Will You Marry Me?</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div id="slide-container">
      <div class="slide active" data-index="0">
        <div class="slide-content">
          <img src="/images/안킬로.gif" alt="" class="intro-gif" />
          <!-- <p class="question">혜리야 안녕?<br>명진이가 할 말이 있대.<br>들어볼래?</p> -->
        </div>
      </div>

      <div class="slide" data-index="1">
        <div class="slide-content">
          <p class="question">혜리야 나는...</p>
          <img src="/images/브라키오사우르스.png" alt="" class="slide-img" />
          <p class="question">브라키오사우르스처럼<br>키가 크지도 않고,</p>
        </div>
      </div>

      <div class="slide" data-index="2">
        <div class="slide-content">
          <img src="/images/안킬로사우르스.png" alt="" class="slide-img" />
          <p class="question">안킬로사우르스처럼<br>튼튼하지도 않고,</p>
        </div>
      </div>

      <div class="slide" data-index="3">
        <div class="slide-content">
          <img src="/images/트리케라톱스.png" alt="" class="slide-img" />
          <p class="question">트리케라톱스처럼<br>화려하지도 않고,</p>
        </div>
      </div>

      <div class="slide" data-index="4">
        <div class="slide-content">
          <img src="/images/티라노사우르스.png" alt="" class="slide-img" />
          <p class="question">티라노사우르스처럼<br>강하지도 않고,</p>
        </div>
      </div>

      <div class="slide" data-index="5">
        <div class="slide-content">
          <img src="/images/랩터.png" alt="" class="slide-img" />
          <p class="question">랩터만큼<br>영리하지도 않고,</p>
        </div>
      </div>

      <div class="slide" data-index="6">
        <div class="slide-content">
          <img src="/images/케찰코아틀루스.png" alt="" class="slide-img" />
          <p class="question">케찰코아틀루스처럼<br>하늘을 날수도 없지만</p>
        </div>
      </div>

      <div class="slide final" data-index="7">
        <div class="slide-content">
          <p class="question big">나랑 결혼해줄래? 💍</p>
          <div class="answer-buttons">
            <button class="btn-yes" onclick="onYes()">응, 할게 💕</button>
            <button class="btn-no" onclick="onNo()">조금만 더 생각해볼게</button>
          </div>
        </div>
      </div>

      <div class="slide celebration" data-index="5">
        <div class="slide-content">
          <p class="question big">사랑해 ❤️</p>
          <p class="sub">영원히 행복하자</p>
          <div class="hearts" id="hearts"></div>
        </div>
      </div>
    </div>

    <div id="nav">
      <div class="dots" id="dots"></div>
      <div id="btn-area">
        <div id="intro-buttons" class="hidden">
          <button class="btn-intro btn-intro-no" onclick="introNo()">싫어</button>
          <button class="btn-intro btn-intro-yes" onclick="introYes()">좋아</button>
        </div>
        <button id="next-btn" onclick="nextSlide()">다음 →</button>
      </div>
    </div>
  </div>

  <!-- 팝업 모달 -->
  <div id="popup-overlay" class="popup-overlay hidden" onclick="closePopup()">
    <div class="popup-box" onclick="event.stopPropagation()">
      <p class="popup-msg">들어봐주면 안될까? 🥺</p>
      <button class="popup-btn" onclick="closePopup()">알겠어</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
